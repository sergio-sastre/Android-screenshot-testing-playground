plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'app.cash.paparazzi'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.example.road.to.effective.snapshot.testing.lazycolumnscreen.paparazzi'
    compileSdk 36

    defaultConfig {
        minSdk 23

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            pseudoLocalesEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    

    buildFeatures {
        // Enables Jetpack Compose for this module
        compose true
    }

    // Enable running tests in parallel
    testOptions {
        unitTests.all {
            if (project.hasProperty("parallel")) {
                maxParallelForks = Runtime.runtime.availableProcessors() / 2
            }
        }
        targetSdk 36
    }
    lint {
        targetSdk 36
    }
}

dependencies {
    implementation project(':lazycolumnscreen')

    // Jetpack Compose
    testImplementation platform('androidx.compose:compose-bom:2026.06.01')
    testImplementation "androidx.compose.material:material"

    testImplementation 'com.google.testparameterinjector:test-parameter-injector:1.22'
}
